<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Scanner Barcode</title>

  <script src="https://unpkg.com/html5-qrcode"
          type="text/javascript"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: auto;
      padding: 20px;
    }

    h2 {
      margin-bottom: 5px;
    }

    p {
      color: #ccc;
    }

    #reader {
      width: 100%;
      margin-top: 20px;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
    }

    #status {
      margin-top: 20px;
      padding: 15px;
      background: #222;
      border-radius: 10px;
    }

    #hasil {
      margin-top: 15px;
      padding: 15px;
      background: white;
      color: black;
      border-radius: 10px;
      font-size: 20px;
      font-weight: bold;
      word-break: break-all;
      display: none;
    }
  </style>
</head>

<body>

<div class="container">

  <h2>📷 Scanner Barcode</h2>

  <p>
    Arahkan kamera HP ke barcode produk
  </p>

  <div id="reader"></div>

  <div id="status">
    Memulai kamera...
  </div>

  <div id="hasil"></div>

</div>

<script>

let scanner;
let sudahScan = false;

async function mulaiScanner() {

  scanner = new Html5Qrcode("reader");

  const config = {
    fps: 10,
    qrbox: {
      width: 300,
      height: 120
    }
  };

  try {

    await scanner.start(
      {
        facingMode: "environment"
      },

      config,

      async function(decodedText) {

        if (sudahScan) return;

        sudahScan = true;

        document.getElementById("status").innerText =
          "Barcode berhasil dibaca!";

        document.getElementById("hasil").innerText =
          decodedText;

        document.getElementById("hasil").style.display =
          "block";

        try {
          await scanner.stop();
        } catch (e) {
          console.log(e);
        }

        /*
         * Kirim barcode kembali
         * ke halaman kasir
         */

        if (
          window.opener &&
          !window.opener.closed
        ) {

          window.opener.postMessage(
            {
              type: "KASIR_BARCODE",
              barcode: decodedText
            },
            "*"
          );

          setTimeout(function() {
            window.close();
          }, 500);

        }

      },

      function(errorMessage) {
        // Error scan diabaikan
      }
    );

    document.getElementById("status").innerText =
      "Kamera aktif. Arahkan ke barcode.";

  } catch (error) {

    console.error(error);

    document.getElementById("status").innerText =
      "Kamera tidak dapat digunakan. " +
      "Pastikan izin kamera diberikan.";

  }

}

mulaiScanner();

</script>

</body>
</html>
